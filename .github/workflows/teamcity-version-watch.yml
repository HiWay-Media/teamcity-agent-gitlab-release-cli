name: TeamCity release watch

# Sorveglia la catena TeamCity -> base image -> nostra immagine agent e agisce:
#
#   base image ricostruita             -> RELEASE: commit + tag vX.Y.Z + GitHub Release
#                                         + dispatch di docker-publish-* su quel tag
#   nuova TeamCity ma base image ferma -> NOTIFY : nessun tag (pubblicherebbe byte identici),
#                                         issue + recap Slack, opzionale nudge al repo della base
#   niente di nuovo                    -> nulla
#
# Il gate e' la base image e non l'annuncio JetBrains perche' Dockerfile.latest fa
# FROM ghcr.io/hiway-media/teamcity-agent-latest, costruita in HiWay-Media/teamcity-agent:
# finche' quella non viene ricostruita, una release qui non cambierebbe il contenuto dell'immagine.
#
# Non serve un PAT: workflow_dispatch e repository_dispatch sono le due eccezioni alla regola
# per cui gli eventi generati con GITHUB_TOKEN non innescano altri workflow. Percio' il tag lo
# creiamo col GITHUB_TOKEN e i publish li lanciamo per dispatch espliciti, non via "on: push: tags".

on:
  schedule:
    # ogni giorno alle 05:17 UTC (minuto sfalsato: gli slot tondi sono congestionati)
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Rilascia anche se la base image non e cambiata'
        type: boolean
        default: false
      dry_run:
        description: 'Calcola tutto senza pushare, rilasciare o lanciare i publish'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: teamcity-version-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit, tag, GitHub Release
      actions: write    # dispatch dei workflow docker-publish-*
      issues: write     # issue "base image ferma"
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      BASE_REPO_PAT: ${{ secrets.BASE_REPO_PAT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check catena TeamCity / base image
        id: check
        run: ./scripts/check-teamcity-release.sh --github-output | tee check.log

      - name: Decide
        id: decide
        env:
          ACTION: ${{ steps.check.outputs.action }}
          BUMP: ${{ steps.check.outputs.bump }}
          FORCE: ${{ github.event.inputs.force_release }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          action="$ACTION"
          bump="$BUMP"
          if [ "${FORCE:-false}" = "true" ] && [ "$action" != "release" ]; then
            action=release
            [ -n "$bump" ] || bump=patch
            echo "forzato: release ${bump} su richiesta manuale"
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "bump=$bump"     >> "$GITHUB_OUTPUT"
          echo "dry=${DRY:-false}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------- RELEASE
      - name: Prepara release
        if: steps.decide.outputs.action == 'release'
        id: prep
        env:
          BUMP: ${{ steps.decide.outputs.bump }}
          VERSION: ${{ steps.check.outputs.version }}
          SHIPPED_TC: ${{ steps.check.outputs.shipped_teamcity }}
          NOTES_URL: ${{ steps.check.outputs.notes }}
          DIGEST: ${{ steps.check.outputs.digest }}
          BASE_VERSION: ${{ steps.check.outputs.base_version }}
          BASE_CREATED: ${{ steps.check.outputs.base_created }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          set -euo pipefail

          last_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          last_tag="${last_tag:-v0.0.0}"
          IFS=. read -r maj min pat <<<"${last_tag#v}"
          case "$BUMP" in
            minor) new_tag="v${maj}.$((min + 1)).0" ;;
            *)     new_tag="v${maj}.${min}.$((pat + 1))" ;;
          esac
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag"   >> "$GITHUB_OUTPUT"

          # ---- corpo della GitHub Release (printf, non heredoc: il markdown e pieno di backtick)
          {
            printf 'Runtime degli agent TeamCity di HiWay Media allineato alla base image ricostruita.\n\n'
            printf '| | |\n|---|---|\n'
            printf '| TeamCity | `%s` -> `%s` |\n' "${SHIPPED_TC:-n/d}" "$VERSION"
            printf '| Base image | `%s` (build %s) |\n' "${BASE_VERSION:-?}" "${BASE_CREATED%%T*}"
            printf '| Digest base | `%s` |\n' "$DIGEST"
            [ -n "$NOTES_URL" ] && printf '| Release notes TeamCity | %s |\n' "$NOTES_URL"
            printf '\n**Immagini pubblicate**\n\n'
            printf -- '- `ghcr.io/hiway-media/teamcity-agent-gitlab-release-cli-latest:%s`\n' "$new_tag"
            printf -- '- `ghcr.io/hiway-media/teamcity-agent-gitlab-release-cli-2023.11.3:%s`\n' "$new_tag"
            printf '\nTag paralleli aggiornati: `%s`, `%s`, `%s`, `latest`.\n' \
              "$new_tag" "${new_tag%.*}" "${new_tag%%.*}"
            printf '\nRilasciata da `.github/workflows/teamcity-version-watch.yml` (%s).\n' "$REASON"
          } > release-notes.md

          # ---- sezione di CHANGELOG
          entry_file="$(mktemp)"
          {
            printf '## [%s] - %s\n\n' "${new_tag#v}" "$(date -u +%F)"
            printf '### Changed\n\n'
            printf -- '- Canale `latest` allineato: %s.\n' "$REASON"
            printf -- '- TeamCity: `%s` -> `%s`.\n' "${SHIPPED_TC:-n/d}" "$VERSION"
            printf -- '- Base image `%s` build %s, digest `%s`.\n' \
              "${BASE_VERSION:-?}" "${BASE_CREATED%%T*}" "$DIGEST"
            printf -- '- Rilascio automatico da `.github/workflows/teamcity-version-watch.yml`.\n'
          } > "$entry_file"

          # inserisce sopra la prima release presente (awk -v non regge i multi-riga)
          tmp="$(mktemp)"
          first_h2="$(grep -n '^## ' CHANGELOG.md | head -n1 | cut -d: -f1 || true)"
          if [ -n "$first_h2" ]; then
            head -n "$((first_h2 - 1))" CHANGELOG.md > "$tmp"
            cat "$entry_file" >> "$tmp"; printf '\n' >> "$tmp"
            tail -n "+${first_h2}" CHANGELOG.md >> "$tmp"
          else
            cat CHANGELOG.md > "$tmp"; printf '\n' >> "$tmp"; cat "$entry_file" >> "$tmp"
          fi
          mv "$tmp" CHANGELOG.md

          # per ultimo: se qualcosa sopra fallisce, lo stato non resta marcato come pubblicato
          ./scripts/check-teamcity-release.sh --mark-shipped "$new_tag"

      - name: Commit, tag e GitHub Release
        if: steps.decide.outputs.action == 'release' && steps.decide.outputs.dry != 'true'
        env:
          NEW_TAG: ${{ steps.prep.outputs.new_tag }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'teamcity-version-watch'
          git config user.email 'dev-ops@hiway.media'
          git add teamcity-version.json CHANGELOG.md
          git commit -m "chore(release): ${NEW_TAG} — base image allineata a TeamCity ${VERSION}"
          git tag -a "$NEW_TAG" -m "Release ${NEW_TAG#v}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$NEW_TAG"
          gh release create "$NEW_TAG" \
            --title "${NEW_TAG} — TeamCity ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Lancia i publish sul tag
        if: steps.decide.outputs.action == 'release' && steps.decide.outputs.dry != 'true'
        env:
          NEW_TAG: ${{ steps.prep.outputs.new_tag }}
        run: |
          set -euo pipefail
          # workflow_dispatch e' eccezione alla regola del GITHUB_TOKEN: questi run partono davvero.
          # I workflow di publish leggono GITHUB_REF, quindi il ref del dispatch DEVE essere il tag.
          for wf in docker-publish-latest.yml docker-publish-2023.11.3.yml; do
            if gh workflow run "$wf" --ref "$NEW_TAG"; then
              echo "dispatch ok: $wf @ $NEW_TAG"
            else
              echo "::warning title=Dispatch fallito::$wf non lanciato: eseguilo a mano su $NEW_TAG"
            fi
          done

      # -------------------------------------------------------------- NOTIFY
      - name: Issue "base image ferma"
        if: steps.decide.outputs.action == 'notify' && steps.check.outputs.pending_stale == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          RELEASED: ${{ steps.check.outputs.released }}
          BASE_VERSION: ${{ steps.check.outputs.base_version }}
          BASE_CREATED: ${{ steps.check.outputs.base_created }}
          BASE_AGE: ${{ steps.check.outputs.base_age }}
          PENDING_DAYS: ${{ steps.check.outputs.pending_days }}
          NOTES_URL: ${{ steps.check.outputs.notes }}
        run: |
          set -euo pipefail
          marker="[watch] base image ferma"
          existing="$(gh issue list --state open --search "$marker in:title" --json number \
                       --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "issue #${existing} gia aperta: nessun commento (evita spam)"
            exit 0
          fi
          body="$(mktemp)"
          {
            printf 'TeamCity **%s** e disponibile da %s giorni, ma la base image non e stata ricostruita:\n' \
              "$VERSION" "${PENDING_DAYS:-?}"
            printf 'una release qui pubblicherebbe byte identici a quelli attuali.\n\n'
            printf '| | |\n|---|---|\n'
            printf '| TeamCity | `%s` (uscita %s) |\n' "$VERSION" "${RELEASED:-?}"
            printf '| Base image | `ghcr.io/hiway-media/teamcity-agent-latest:latest` = `%s`, build %s (%s giorni) |\n' \
              "${BASE_VERSION:-?}" "${BASE_CREATED%%T*}" "${BASE_AGE:-?}"
            [ -n "$NOTES_URL" ] && printf '| Release notes | %s |\n' "$NOTES_URL"
            printf '\n**Azione**: ricostruire e pubblicare `teamcity-agent-latest` in\n'
            printf 'https://github.com/HiWay-Media/teamcity-agent. Appena il digest cambia, il watcher\n'
            printf 'di questo repo rilascia da solo e pubblica le immagini.\n\n'
            printf 'Aperta da `.github/workflows/teamcity-version-watch.yml`.\n'
          } > "$body"
          gh issue create --title "${marker}: TeamCity ${VERSION} non arriva nell'agent" \
            --body-file "$body" --label automated 2>/dev/null \
          || gh issue create --title "${marker}: TeamCity ${VERSION} non arriva nell'agent" \
            --body-file "$body"

      - name: Nudge al repo della base image (opzionale)
        if: steps.decide.outputs.action == 'notify' && env.BASE_REPO_PAT != ''
        continue-on-error: true
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          # Richiede che HiWay-Media/teamcity-agent gestisca "on: repository_dispatch".
          curl -sS --fail --max-time 20 -X POST \
            -H "Authorization: Bearer ${BASE_REPO_PAT}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/HiWay-Media/teamcity-agent/dispatches \
            -d "$(jq -n --arg v "$VERSION" \
                  '{event_type:"teamcity-release", client_payload:{teamcity_version:$v}}')" \
            && echo "repository_dispatch inviato a HiWay-Media/teamcity-agent"

      # ------------------------------------------------------------- SEMPRE
      - name: Summary
        if: always()
        env:
          ACTION: ${{ steps.decide.outputs.action }}
          DRY: ${{ steps.decide.outputs.dry }}
          NEW_TAG: ${{ steps.prep.outputs.new_tag }}
        run: |
          {
            echo '## TeamCity release watch'
            echo
            echo '```'
            cat check.log 2>/dev/null || echo 'check non eseguito'
            echo '```'
            echo
            case "${ACTION:-none}" in
              release)
                if [ "${DRY:-false}" = "true" ]; then
                  echo "Azione: **release \`${NEW_TAG}\`** — dry-run: niente push, niente publish."
                else
                  echo "Azione: **release \`${NEW_TAG}\`** — tag, GitHub Release e publish lanciati."
                fi ;;
              notify)  echo 'Azione: **notify** — nessun tag: la base image non e cambiata, una release pubblicherebbe byte identici.' ;;
              *)       echo 'Azione: **nessuna** — catena allineata.' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recap Slack
        if: steps.decide.outputs.action != 'none' && env.SLACK_WEBHOOK_URL != ''
        env:
          ACTION: ${{ steps.decide.outputs.action }}
          REASON: ${{ steps.check.outputs.reason }}
          VERSION: ${{ steps.check.outputs.version }}
          NEW_TAG: ${{ steps.prep.outputs.new_tag }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = release ]; then
            head="*teamcity-agent-gitlab-release-cli* — rilasciata \`${NEW_TAG}\` (TeamCity ${VERSION})"
          else
            head="*teamcity-agent-gitlab-release-cli* — TeamCity ${VERSION} non arriva nell'agent: base image ferma"
          fi
          curl -sS --max-time 15 -X POST -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$head" --arg r "$REASON" \
                            --arg u "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{blocks:[
                 {type:"section",text:{type:"mrkdwn",text:$t}},
                 {type:"section",text:{type:"mrkdwn",text:("*Motivo:* "+$r)}},
                 {type:"context",elements:[{type:"mrkdwn",text:("<"+$u+"|run GitHub Actions>")}]}
               ]}')" \
            "$SLACK_WEBHOOK_URL"
